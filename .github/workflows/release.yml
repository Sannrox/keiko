name: Release

# Push the tag v<version> to publish ghcr.io/sannrox/keiko:v<version>, the
# image both tenkai products under deploy/ install. The tag, package.json and
# every manifest must name the same version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag matches the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          grep -qx "version = \"$version\"" deploy/tenkai.toml
          grep -qx "version = \"$version\"" deploy/kubernetes/tenkai.toml
          ! grep -rho "ghcr.io/sannrox/keiko:[^\" ]*" deploy | grep -vx "ghcr.io/sannrox/keiko:v$version"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sannrox/keiko:${{ github.ref_name }}
