# Postgres for the ERP: logical replication and TLS on, data in a claim that
# outlives the pod. TLS comes from Secret keiko-tls; the server copies its key
# to a private file because Postgres refuses a group-readable key.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keiko-db
  labels:
    app: keiko-db
spec:
  serviceName: keiko-db
  replicas: 1
  selector:
    matchLabels:
      app: keiko-db
  template:
    metadata:
      labels:
        app: keiko-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: keiko
            - name: POSTGRES_PASSWORD
              value: keiko
            - name: POSTGRES_DB
              value: erp
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              install -m 600 /tls/tls.crt /tmp/server.crt
              install -m 600 /tls/tls.key /tmp/server.key
              exec docker-entrypoint.sh postgres \
                -c wal_level=logical \
                -c ssl=on \
                -c ssl_cert_file=/tmp/server.crt \
                -c ssl_key_file=/tmp/server.key
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /tls
              readOnly: true
          # TCP, not the socket: first-start init answers on the socket before TCP is up.
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "keiko", "-d", "erp"]
            periodSeconds: 2
      volumes:
        - name: tls
          secret:
            secretName: keiko-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keiko-db
  labels:
    app: keiko-db
spec:
  selector:
    app: keiko-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
